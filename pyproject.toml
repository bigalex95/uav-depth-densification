[project]
name = "uav-depth-densification"
version = "0.1.0"
description = "UAV depth densification: COLMAP sparse points + Depth Anything V2 relative depth + polynomial OLS scale fit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "opencv-python",
    "numpy",
    "pillow",
    "tifffile",
    "tqdm",
    "pytest",
    "open3d",
    "matplotlib",
    "scipy",
]
